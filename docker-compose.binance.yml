services:
  binance:
    build:
      context: .
      dockerfile: Dockerfile.binance
    env_file:
      - .env.binance
    restart: unless-stopped
    init: true
    volumes:
      - ./binance-data:/app/binance-data
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
